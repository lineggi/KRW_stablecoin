<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이선기 · 프로젝트 소개</title>
<meta name="description" content="디지털 자산을 현실로 만들고 있는 PM 이선기 — 바이브 기획서 예시와 원화 스테이블코인 시뮬레이터 소개.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="favicon.svg">
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link rel="stylesheet" as="style" crossorigin href="https://cdnjs.cloudflare.com/ajax/libs/pretendard/1.3.9/static/pretendard.css">
<style>
  :root{
    --paper:#EEF2F0; --ink:#11201C; --ink-soft:#566661; --ink-faint:#8A968F;
    --line:#DBE3DF; --card:#FFFFFF;
    --jade:#0E9F6E; --jade-deep:#0A6E4C; --jade-tint:#E3F4EC;
    --gold:#B0822F; --gold-tint:#F3E9D2;
    --blue:#2B5AA0; --blue-tint:#E6EDF7;
    --radius:18px; --shadow:0 22px 55px -24px rgba(17,32,28,.5);
    --f:'Pretendard',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{font-family:var(--f);background:radial-gradient(120% 80% at 50% -10%,#F7FAF8 0%,var(--paper) 55%) fixed;
    color:var(--ink);-webkit-font-smoothing:antialiased;display:flex;justify-content:center;
    padding:32px 16px 48px;line-height:1.5;word-break:keep-all;overflow-wrap:break-word;overflow-x:hidden}
  .wrap{width:100%;max-width:460px}

  .eyebrow{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;
    letter-spacing:.14em;text-transform:uppercase;color:var(--jade-deep);
    background:var(--jade-tint);padding:6px 11px;border-radius:999px}
  .eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--jade);box-shadow:0 0 0 3px rgba(14,159,110,.18)}
  h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:14px 0 7px;line-height:1.3;text-wrap:balance}
  h1 b{color:var(--jade-deep)}
  .sub{font-size:14px;color:var(--ink-soft);max-width:42ch;line-height:1.6;text-wrap:pretty}

  .list{margin-top:22px;display:grid;gap:13px}
  .item{display:flex;align-items:center;gap:15px;text-decoration:none;color:inherit;
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 17px;
    box-shadow:0 14px 32px -26px rgba(17,32,28,.5);transition:transform .14s,border-color .2s,box-shadow .2s}
  .item:hover{transform:translateY(-2px);border-color:var(--jade);box-shadow:0 22px 44px -24px rgba(14,159,110,.4)}
  .item:focus-visible{outline:3px solid var(--jade-tint);outline-offset:2px}
  .icon{flex:0 0 auto;width:54px;height:54px;border-radius:15px;display:flex;align-items:center;
    justify-content:center;font-size:27px;background:var(--gold-tint)}
  .item.sim .icon{background:var(--jade-tint)}
  .body{flex:1;min-width:0;display:flex;flex-direction:column}
  .title{font-size:17px;font-weight:800;letter-spacing:-.01em}
  .desc{font-size:13px;color:var(--ink-soft);margin-top:4px;line-height:1.5}
  .tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
  .tag{font-size:10px;font-weight:700;color:var(--ink-faint);background:#EEF2F0;border-radius:6px;padding:2px 7px}
  .arrow{flex:0 0 auto;color:var(--ink-faint);font-size:19px;font-weight:800}

  .foot{font-size:12px;color:var(--ink-faint);margin-top:18px;text-align:center;line-height:1.5}

  @media (max-width:360px){
    body{padding:22px 13px 36px}
    h1{font-size:23px}
    .icon{width:48px;height:48px;font-size:24px}
    .title{font-size:16px}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <h1>안녕하세요.<br>디지털 자산을 <b>현실로 만들고 있는</b><br>PM 이선기입니다.</h1>
  <p class="sub">제가 만들어 가고 있는 프로젝트를 소개해드립니다.</p>

  <div class="list">
    <a class="item plan" href="vibe-plan.html">
      <span class="icon">📝</span>
      <span class="body">
        <span class="title">바이브 기획서 예시</span>
        <span class="desc">모바일 와이어프레임으로 화면 흐름을 정리한 기획서 예시</span>
        <span class="tags"><span class="tag">기획</span><span class="tag">와이어프레임</span><span class="tag">화면 흐름</span></span>
      </span>
      <span class="arrow">→</span>
    </a>

    <a class="item sim" href="simulator.html">
      <span class="icon">🪙</span>
      <span class="body">
        <span class="title">원화 스테이블코인 시뮬레이터</span>
        <span class="desc">원화 스테이블코인이 어디에 어떻게 쓰일지 장면으로 따라가는 인터랙티브 데모</span>
        <span class="tags"><span class="tag">개인</span><span class="tag">기업</span><span class="tag">해외 송금</span><span class="tag">안전·규제</span></span>
      </span>
      <span class="arrow">→</span>
    </a>
  </div>

  <p class="foot">© lineggi</p>

</div>
</body>
</html>
